<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your brand — lesson title</title>
  <meta name="theme-color" content="#0c1424">
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../motion.css">
  <link rel="stylesheet" href="../brand.css">
  <script src="../theme.js" defer></script>
  <script src="../motion.js" defer></script>
</head>
<body class="mw-theme" data-mw-background="fixed" style="margin:0">
  <main class="mw-page mw-container mw-section mw-stack">
    <!-- Replace the sample name and initials with your own identity. -->
    <a class="mw-brand" href="../index.html"><span class="mw-stamp" aria-hidden="true">YB</span><span class="mw-brand-name">Your brand<span class="mw-brand-caption">YOUR SHORT TAGLINE</span></span></a>
    <button class="mw-button mw-button--quiet" type="button" data-mw-motion-toggle hidden>Pause motion</button>
    <p class="mw-eyebrow">LESSON 01</p>
    <h1 class="mw-title" data-mw-reveal="up">Your lesson title</h1>
    <p class="mw-lead">Write a short introduction that tells the learner what they will practise.</p>
    <article class="mw-paper mw-stack mw-hover-card" data-mw-reveal="up" data-mw-tilt>
      <h2 class="mw-subheading">Practice question</h2>
      <p>Add your own question here.</p>
      <!-- Keep the button hidden and the answer visible in source HTML.
           The optional script enhances this into an accessible reveal. -->
      <button type="button" class="mw-button" data-mw-toggle="answer-one" hidden>Show answer</button>
      <div id="answer-one" class="mw-note">Your answer and explanation go here.</div>
    </article>
    <details class="mw-details"><summary>Study hint</summary><p>A useful clue goes here. Native details work without JavaScript.</p></details>
  </main>
</body>
</html>
